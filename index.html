<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Drive – Open-World Car Simulator</title>
<style>
:root{--ac:#ff8a1f;--fg:#e8edf2;--mut:#8b96a5}

.ov button,.ov .card,.ov .panel{pointer-events:auto}

#menu{flex-direction:column;justify-content:space-between;align-items:center;padding:28px 20px;background:linear-gradient(#0a0e14cc,transparent 30%,transparent 55%,#0a0e14ee)}
#menu h1{font-size:2.2rem;letter-spacing:.35em;font-weight:800;text-align:center}
#menu h1 span{color:var(--ac)}#menu p{color:var(--mut);text-align:center;margin-top:6px}
#cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.card{width:260px;padding:16px 18px;border-radius:16px;background:#121923cc;border:1px solid #ffffff1f;backdrop-filter:blur(8px);cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px)}.card.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 10px 30px #ff8a1f33}
.card h3{font-size:1.1rem}.card small{color:var(--mut)}
.st{margin-top:10px;font-size:.78rem;color:var(--mut)}.st div{display:flex;justify-content:space-between}
.bar{height:5px;border-radius:3px;background:#ffffff1f;margin:3px 0 7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
#go,.panel button{margin-top:16px;padding:14px 44px;border:0;border-radius:40px;background:var(--ac);color:#111;font-weight:700;font-size:1.05rem;letter-spacing:.08em}
#go:hover,.panel button:hover{filter:brightness(1.1)}
#mb{display:flex;flex-direction:column;align-items:center}
#hud #tl{position:absolute;top:18px;left:20px;display:flex;flex-direction:column;gap:2px;text-shadow:0 1px 6px #000}
#tl b{font-size:1.2rem}#tl span{color:#cfd6dd;font-size:.85rem}
#pb{position:absolute;top:16px;right:18px;background:#0f1520aa;border:1px solid #ffffff2a;padding:8px 14px;border-radius:10px;font-size:.85rem}
#gauge{position:absolute;left:18px;bottom:18px;width:170px;height:170px}
#mm{position:absolute;right:18px;bottom:18px;width:190px;height:190px;border-radius:50%;box-shadow:0 0 0 3px #0c1118,0 0 0 5px #ffffff55,0 6px 20px #0008}
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:.75rem;color:#dfe6ee;background:#0c1118aa;padding:6px 12px;border-radius:20px;white-space:nowrap;transition:opacity 2s}
#pause{background:#070a0fcc;align-items:center;justify-content:center}
.panel{background:#121923;border:1px solid #ffffff22;border-radius:18px;padding:30px 40px;text-align:center;display:flex;flex-direction:column;gap:2px}
.panel button+button{background:#ffffff1a;color:var(--fg);margin-top:10px}
@media(max-width:700px){#hint{display:none}#gauge{width:120px;height:120px}#mm{width:130px;height:130px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<canvas id="gl"></canvas>
<div id="menu" class="ov" style="display:flex">
 <div><h1>CITY<span>DRIVE</span></h1><p>Open-world driving simulator · choose your car (← → to browse)</p></div>
 <div id="mb"><div id="cards"></div><button id="go">START DRIVING</button></div>
</div>
<div id="hud" class="ov">
 <div id="tl"><b id="vn"></b><span id="cm"></span></div>

</div>

const OFF=cv(1400,1400,g=>{const X=x=>(350+x)*2,Y=z=>(350-z)*2;g.fillStyle='#202a35';g.fillRect(0,0,1400,1400);

const K={};let state='menu',idx=0,car=null,camMode=0,snap=true,AC,osc,gn,last=performance.now(),ch=0;
const cards=$('cards');
SPECS.forEach((s,i)=>{const d=document.createElement('div');d.className='card';

 d.onclick=()=>sel(i);cards.append(d)});
function sel(i){idx=i;[...cards.children].forEach((c,k)=>c.classList.toggle('on',k==i));PV.forEach((p,k)=>p.g.visible=k==i)}sel(0);
const show=(id,on)=>$(id).style.display=on?(id=='menu'||id=='pause'?'flex':'block'):'none';

function start(){audioOn();if(AC&&AC.state=='suspended')AC.resume();
 if(car){G.remove(car.m.g)}const sp=SPECS[idx],m=makeCar(sp);G.add(m.g);
 car={sp,m,x:32,z:0,h:0,vx:0,vz:0,steer:0,y:0,vf:0,roll:0,pitch:0,gear:'N'};
 m.g.traverse(o=>{if(o.isMesh)o.castShadow=true});G.add(cam);setCam(0);ch=0;
 $('vn').textContent=sp.name;state='play';show('menu',0);show('hud',1);show('pause',0);$('hint').style.opacity=1;setTimeout(()=>$('hint').style.opacity=0,7000)}
function setCam(m){camMode=m;$('cm').textContent=m?'Cabin view':'Third-person view';
 if(m){car.m.g.add(cam);cam.position.set(...car.sp.eye);cam.rotation.set(0,PI,0);cam.fov=78}else{G.add(cam);cam.fov=60}cam.updateProjectionMatrix();snap=true}

 if(Math.abs(c.x-rx)<Math.abs(c.z-rz))c.x=rx;else c.z=rz;c.vx=c.vz=0;c.steer=0;c.roll=c.pitch=0;snap=true}

$('go').onclick=start;$('pb').onclick=togglePause;$('rs').onclick=togglePause;

addEventListener('keydown',e=>{K[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();

 else{if(e.code=='Escape'&&!e.repeat)togglePause();if(state=='play'&&!e.repeat){if(e.code=='KeyC')setCam(1-camMode);if(e.code=='KeyR')reset()}}});
addEventListener('keyup',e=>K[e.code]=0);addEventListener('blur',()=>{for(const k in K)K[k]=0;if(state=='play')togglePause()});
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=pcam.aspect=w/h;cam.updateProjectionMatrix();pcam.updateProjectionMatrix()}addEventListener('resize',resize);resize();

/* ---------- physics ---------- */
function step(c,dt){const s=c.sp,vmax=s.top/3.6;
 const th=K.KeyW||K.ArrowUp,br=K.KeyS||K.ArrowDown,hb=K.Space,tgt=(K.KeyA||K.ArrowLeft?1:0)-(K.KeyD||K.ArrowRight?1:0);
 let fx=Math.sin(c.h),fz=Math.cos(c.h),vf=c.vx*fx+c.vz*fz;
 const ms=s.sLow+(s.sHigh-s.sLow)*Math.pow(Math.min(1,Math.abs(vf)/vmax),.7);
 c.steer+=(tgt*ms-c.steer)*Math.min(1,dt*(tgt?7:10));
 let yaw=vf*Math.tan(c.steer)/s.L;const ly=s.latG/Math.max(Math.abs(vf),4);yaw=Math.max(-ly,Math.min(ly,yaw));if(hb)yaw*=1.5;
 c.h+=yaw*dt;fx=Math.sin(c.h);fz=Math.cos(c.h);const lx=Math.cos(c.h),lz=-Math.sin(c.h);
 vf=c.vx*fx+c.vz*fz;let vl=c.vx*lx+c.vz*lz,a=0;
 if(th)a=vf<-.5?s.brake:s.acc*Math.max(0,1-Math.pow(Math.max(vf,0)/vmax,3));
 else if(br)a=vf>.5?-s.brake:-s.acc*.5*Math.max(0,1+vf/(vmax*.25));
 vf+=a*dt;
 if(!th&&!br){const d=(1+.0009*vf*vf)*dt;vf=Math.abs(vf)<d?0:vf-Math.sign(vf)*d}
 if(hb){const d=9*dt;vf=Math.abs(vf)<d?0:vf-Math.sign(vf)*d}
 vl*=Math.exp(-(hb?s.grip*.12:s.grip)*dt);
 c.vx=fx*vf+lx*vl;c.vz=fz*vf+lz*vl;c.x+=c.vx*dt;c.z+=c.vz*dt;
 // collisions
 let hit=0;for(const o of s.cols){let px=c.x+fx*o,pz=c.z+fz*o;
  for(const b of COL){if(px<b.x1-s.hw||px>b.x2+s.hw||pz<b.z1-s.hw||pz>b.z2+s.hw)continue;
   const cx=Math.max(b.x1,Math.min(px,b.x2)),cz=Math.max(b.z1,Math.min(pz,b.z2)),dx=px-cx,dz=pz-cz,d=Math.hypot(dx,dz);let nx,nz,pen;
   if(d>1e-4){nx=dx/d;nz=dz/d;pen=s.hw-d}else{const l=px-b.x1,r=b.x2-px,t=pz-b.z1,u=b.z2-pz,m=Math.min(l,r,t,u);
    if(m==l){nx=-1;nz=0;pen=l+s.hw}else if(m==r){nx=1;nz=0;pen=r+s.hw}else if(m==t){nx=0;nz=-1;pen=t+s.hw}else{nx=0;nz=1;pen=u+s.hw}}
   if(pen>0){c.x+=nx*pen;c.z+=nz*pen;px+=nx*pen;pz+=nz*pen;const vn=c.vx*nx+c.vz*nz;
    if(vn<0){c.vx-=1.15*vn*nx;c.vz-=1.15*vn*nz;hit=Math.max(hit,-vn)}}}}
 if(hit>1){c.vx*=.9;c.vz*=.9}
 const B=335;c.x=Math.max(-B,Math.min(B,c.x));c.z=Math.max(-B,Math.min(B,c.z));
 c.vf=c.vx*fx+c.vz*fz;c.vl=vl;c.th=th;c.br=br||hb;
 const ty=(near(c.x)<7.2||near(c.z)<7.2||Math.abs(c.x)>155||Math.abs(c.z)>155)?0:.12;c.y+=(ty-c.y)*Math.min(1,dt*12);
 c.pitch+=(-a*.004-c.pitch)*Math.min(1,dt*6);c.roll+=(Math.max(-.07,Math.min(.07,yaw*c.vf*.0012))-c.roll)*Math.min(1,dt*6);
 const m=c.m;m.g.position.set(c.x,c.y+.02,c.z);m.g.rotation.y=c.h;m.body.rotation.x=c.pitch;m.body.rotation.z=c.roll;
 for(const w of m.W){w.sp.rotation.x+=c.vf*dt/w.r;if(w.front)w.pv.rotation.y=c.steer}
 if(m.sw)m.sw.rotation.z=-c.steer*(s.id=='f1'?3:5);

 const ratio=Math.abs(c.vf)/vmax;c.gear=c.vf<-.5?'R':Math.abs(c.vf)<.8?'N':String(1+Math.min(5,Math.floor(ratio*6)));

function camUpdate(c,dt){const s=c.sp;
 if(camMode==1){cam.fov+=((78+Math.min(10,Math.abs(c.vf)*.08))-cam.fov)*.1;cam.updateProjectionMatrix();return}
 const d=((c.h-ch+PI)%(2*PI)+2*PI)%(2*PI)-PI;ch+=snap?d:d*(1-Math.exp(-dt*3.5));

 cam.lookAt(c.x+sx*4,c.y+1.2,c.z+sz*4);cam.fov+=((60+Math.min(18,Math.abs(c.vf)*.22))-cam.fov)*.08;cam.updateProjectionMatrix()}

const gc=$('gauge').getContext('2d'),mc=$('mm').getContext('2d');
function gauge(kmh,top,gear){const g=gc,S=340,c=S/2,mx=Math.ceil(top/20)*20,a0=.75*PI,sw=1.5*PI,f=Math.min(1,kmh/mx);g.clearRect(0,0,S,S);

 const a=a0+sw*f;g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.moveTo(c,c);g.lineTo(c+Math.cos(a)*(c-58),c+Math.sin(a)*(c-58));g.stroke();

function minimap(c){const g=mc,S=380,h=c.h;g.save();g.clearRect(0,0,S,S);g.beginPath();g.arc(S/2,S/2,S/2,0,7);g.clip();g.fillStyle='#202a35';g.fillRect(0,0,S,S);

/* ---------- loop ---------- */
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state=='menu'){PV[idx].g.rotation.y+=dt*.5;pcam.position.set(5.6,2.3,6.8);pcam.lookAt(0,.7,0);R.render(V,pcam);return}
 if(state=='play'){step(car,dt);camUpdate(car,dt);
  const t=now/1000%14<7;redM.emissiveIntensity=t?2:.05;grnM.emissiveIntensity=t?.05:2;
